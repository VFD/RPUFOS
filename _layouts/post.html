---
layout: default
---

<p class="post-meta">
  &#128197;<b> <time datetime="{{ page.date | date_to_xmlschema }}"> {{ page.date | date: "%d/%m/%Y" }} </time> </b>
  -
  <b>{{ page.author }}</b>
  -
  <b>{{ page.type }}</b>
</p>

<h1 class="post-title">{{ page.title }}</h1>

  <div class="post-content">
    {{ content }}
  </div>

<hr style="width:66%"/>

  
  <!-- Navigation entre les posts -->
  <div class="post-navigation">
    {% if page.previous.url %}
      <a class="prev-post" href="{{ site.baseurl }}{{ page.previous.url }}">&laquo; {{ page.previous.title }}</a>
    {% endif %}

{% include blog-link.html %}
    
    {% if page.next.url %}
      <a class="next-post" href="{{ site.baseurl }}{{ page.next.url }}">{{ page.next.title }} &raquo;</a>
    {% endif %}
  </div>
 
</article>
<br />
